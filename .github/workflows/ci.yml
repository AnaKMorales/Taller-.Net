name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar herramientas
        run: dotnet tool restore

      - name: Compilar (advertencias como errores)
        run: dotnet build UltimaMilla.slnx -c Release -warnaserror

      - name: Probar
        run: dotnet test UltimaMilla.slnx -c Release --no-build

      - name: Medir cobertura de Domain y Application
        shell: pwsh
        run: ./scripts/Test-Coverage.ps1 -NoBuild -ResultsDirectory '${{ runner.temp }}/ultimamilla-cobertura'

      - name: Publicar reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-domain-application
          path: ${{ runner.temp }}/ultimamilla-cobertura/**/coverage.cobertura.xml

  # Pruebas E2E con Playwright contra la Web levantada en el runner
  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ultimamilla
          POSTGRES_USER: ultimamilla
          POSTGRES_HOST_AUTH_METHOD: trust # base descartable del runner
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ultimamilla" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ConnectionStrings__UltimaMilla: Host=localhost;Port=5432;Database=ultimamilla;Username=ultimamilla
      ConnectionStrings__Redis: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: |
          dotnet tool restore
          dotnet build UltimaMilla.slnx -c Release

      - name: Migraciones
        run: dotnet ef database update --project src/UltimaMilla.Infrastructure -c Release --no-build

      - name: Levantar la Web
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5299
        run: |
          nohup dotnet src/UltimaMilla.Web/bin/Release/net10.0/UltimaMilla.Web.dll > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5299/live && exit 0; sleep 2; done
          cat web.log; exit 1

      - name: Instalar Chromium
        run: pwsh tests/E2E/UltimaMilla.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Pruebas E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5299
        run: dotnet test tests/E2E/UltimaMilla.E2E.Tests -c Release --no-build --logger "trx;LogFileName=e2e.trx"

      - name: Log de la Web y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            web.log
            tests/E2E/UltimaMilla.E2E.Tests/TestResults/*.trx

  # Etapas 3 a 5 del pipeline (diseño, 3.4): solo sobre main, después de compilar y probar.
  # Se activan cuando el repositorio tiene la variable AWS_ROLE_ARN (salida de Terraform: ver deploy/terraform/README.md).
  imagenes:
    name: Imágenes a ECR (${{ matrix.imagen }})
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: credenciales temporales de AWS, sin claves guardadas
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { imagen: web, contexto: ., dockerfile: src/UltimaMilla.Web/Dockerfile }
          - { imagen: worker, contexto: ., dockerfile: src/UltimaMilla.Worker/Dockerfile }
          - { imagen: migrador, contexto: ., dockerfile: deploy/migrador/Dockerfile }
          - { imagen: receptor, contexto: tools/UltimaMilla.ReceptorWebhooks, dockerfile: tools/UltimaMilla.ReceptorWebhooks/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Las etiquetas de ECR son inmutables: si se vuelve a correr el mismo commit, la imagen ya está y no se repite.
      - name: ¿Ya existe la imagen con este commit?
        id: existe
        run: |
          if aws ecr describe-images --repository-name "ultimamilla-${{ matrix.imagen }}" --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existe.outputs.existe == 'false'

      - name: Construir y subir
        if: steps.existe.outputs.existe == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/ultimamilla-${{ matrix.imagen }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  desplegar:
    name: Desplegar en la EC2 (SSM Run Command)
    needs: imagenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: despliegue
      cancel-in-progress: false # un despliegue en curso no se corta a la mitad
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # La instancia no tiene acceso al repositorio: baja estos archivos del bucket de despliegue.
      - name: Subir archivos de despliegue a S3
        run: |
          aws s3 cp deploy/compose.yaml     "s3://${{ vars.DEPLOY_BUCKET }}/deploy/compose.yaml"
          aws s3 cp deploy/compose.aws.yaml "s3://${{ vars.DEPLOY_BUCKET }}/deploy/compose.aws.yaml"
          aws s3 cp deploy/aws/desplegar.sh "s3://${{ vars.DEPLOY_BUCKET }}/deploy/desplegar.sh"
          aws s3 cp deploy/traefik "s3://${{ vars.DEPLOY_BUCKET }}/deploy/traefik" --recursive

      - name: Ordenar el despliegue por SSM
        run: |
          parametros=$(jq -nc --arg bucket "${{ vars.DEPLOY_BUCKET }}" --arg tag "${GITHUB_SHA}" \
            '{commands: ["cloud-init status --wait || true", "/usr/local/bin/aws s3 sync s3://\($bucket)/deploy/ /opt/ultimamilla/deploy/ --only-show-errors", "bash /opt/ultimamilla/deploy/desplegar.sh \($tag)"]}')
          id=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Despliegue ${GITHUB_SHA::7}" \
            --parameters "$parametros" \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "COMMAND_ID=$id" >> "$GITHUB_ENV"
          aws ssm wait command-executed --command-id "$id" --instance-id "${{ vars.AWS_INSTANCE_ID }}"

      - name: Resultado del despliegue
        if: always() && env.COMMAND_ID != ''
        run: |
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query '{Estado: Status, Salida: StandardOutputContent, Errores: StandardErrorContent}' --output yaml

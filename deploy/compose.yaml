  name: ultimamilla-local

  # Sin perfil: PostgreSQL, Redis (cache, ADR-004) y RabbitMQ, para desarrollar desde el IDE:
  #   docker compose --env-file .env up -d
  # Perfil "app": migrador, web, worker y receptor (web y worker esperan a que el migrador termine bien):
  #   docker compose --env-file .env --profile app up -d --build
  # Todo escucha solo en 127.0.0.1. Límites de memoria pensados para una EC2 de 4 a 8 GB (suman ~2,4 GB).
  services:
    postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-ultimamilla}
        POSTGRES_USER: ${POSTGRES_USER:-ultimamilla}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
      mem_limit: 512m
      ports:
        - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
        interval: 3s
        timeout: 3s
        retries: 20
        start_period: 5s

    redis:
      image: redis:7-alpine
      command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
      mem_limit: 192m
      ports:
        - "127.0.0.1:${REDIS_PORT:-56379}:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 3s
        timeout: 3s
        retries: 20

    rabbitmq:
      image: rabbitmq:3-management-alpine
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ultimamilla}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en deploy/.env}
      mem_limit: 512m
      ports:
        - "127.0.0.1:${RABBITMQ_PORT:-55672}:5672"
        - "127.0.0.1:${RABBITMQ_MGMT_PORT:-56672}:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 15s

    # Migrador: aplica las migraciones pendientes y termina (bundle de EF self-contained, ver deploy/migrador/Dockerfile).
    # Idempotente: si la base ya está al día no hace nada y sale con 0. Imagen configurable (ECR): MIGRADOR_IMAGE.
    migrador:
      profiles: ["app"]
      image: ${MIGRADOR_IMAGE:-ultimamilla-migrador:local}
      build:
        context: ..
        dockerfile: deploy/migrador/Dockerfile
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        ConnectionStrings__UltimaMilla: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ultimamilla};Username=${POSTGRES_USER:-ultimamilla};Password="${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}"
      mem_limit: 256m
      restart: "no"

    # Web: API, backoffice, portal, seguimiento y la PWA del repartidor (/repartidor/), todo en un proceso.
    # Para usar la imagen de ECR: WEB_IMAGE=<cuenta>.dkr.ecr.<region>.amazonaws.com/ultimamilla-web:<sha> y `up` sin --build.
    web:
      profiles: ["app"]
      image: ${WEB_IMAGE:-ultimamilla-web:local}
      build:
        context: ..
        dockerfile: src/UltimaMilla.Web/Dockerfile
      depends_on:
        migrador:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
      environment:
        # Production por defecto. Solo para la demo de webhooks (/dev/datos-demo): WEB_ENTORNO=Development.
        ASPNETCORE_ENVIRONMENT: ${WEB_ENTORNO:-Production}
        ConnectionStrings__UltimaMilla: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ultimamilla};Username=${POSTGRES_USER:-ultimamilla};Password="${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}"
        ConnectionStrings__Redis: redis:6379
        RabbitMq__Host: rabbitmq
        RabbitMq__Puerto: "5672"
        RabbitMq__Usuario: ${RABBITMQ_USER:-ultimamilla}
        RabbitMq__Clave: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en deploy/.env}
        # Web solo confía en X-Forwarded-* si vienen de esta red (Traefik); ver CabecerasReenviadas.cs.
        ForwardedHeaders__RedConfiable: ${RED_INTERNA_SUBNET:-172.28.0.0/16}
        # Claves de cookies/antiforgery: en el volumen, para que las sesiones sobrevivan a un reinicio.
        DataProtection__RutaClaves: /claves
      volumes:
        - claves_data:/claves
      ports:
        - "127.0.0.1:${WEB_PORT:-8080}:8080"
      mem_limit: 512m
      restart: unless-stopped

    # Worker: publica el outbox y consume la cola "avisos" (envía los webhooks firmados).
    worker:
      profiles: ["app"]
      build:
        context: ..
        dockerfile: src/UltimaMilla.Worker/Dockerfile
      depends_on:
        migrador:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
      environment:
        ConnectionStrings__UltimaMilla: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ultimamilla};Username=${POSTGRES_USER:-ultimamilla};Password="${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}"
        RabbitMq__Host: rabbitmq
        RabbitMq__Puerto: "5672"
        RabbitMq__Usuario: ${RABBITMQ_USER:-ultimamilla}
        RabbitMq__Clave: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en deploy/.env}
        # Apagado por defecto: el Worker bloquea destinos en direcciones privadas (protección contra que un comercio
        # apunte a la red interna). SOLO DEMO: WEBHOOKS_PERMITIR_DESTINOS_PRIVADOS=true, porque el receptor es privado.
        Webhooks__PermitirDestinosPrivados: ${WEBHOOKS_PERMITIR_DESTINOS_PRIVADOS:-false}
      mem_limit: 256m
      restart: unless-stopped

    # Receptor de webhooks de prueba (tools/UltimaMilla.ReceptorWebhooks): /ok, /fail, /slow y /flaky.
    # Dentro de Docker se llama http://receptor:8080; desde tu máquina, http://127.0.0.1:${RECEPTOR_PORT:-58080}.
    receptor:
      profiles: ["app"]
      build:
        context: ../tools/UltimaMilla.ReceptorWebhooks
      environment:
        # Debe coincidir con el secreto de las suscripciones (la demo usa "secreto-demo").
        Receptor__Secreto: ${WEBHOOK_SECRETO:-secreto-demo}
      ports:
        - "127.0.0.1:${RECEPTOR_PORT:-58080}:8080"
      mem_limit: 128m
      restart: unless-stopped

  # Red interna con subred fija. Traefik (y solo él) llega a Web desde esta subred, así que Web confía en
  # X-Forwarded-* únicamente de acá: pasar la misma variable a Web como ForwardedHeaders__RedConfiable.
  networks:
    default:
      ipam:
        config:
          - subnet: ${RED_INTERNA_SUBNET:-172.28.0.0/16}

  volumes:
    postgres_data:
    rabbitmq_data:
    claves_data:
